<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e3a5f;#0f172a" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#1e293b"><animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="vercel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="render" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="supa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pipeline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#38bdf8" filter="url(#glow)">
    🏗️ System Architecture
  </text>

  <!-- Internet / Browser (top) -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze"/>
    <rect x="300" y="50" width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="400" y="77" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 Browser</text>
  </g>

  <!-- Arrow down from browser -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    <line x1="400" y1="94" x2="400" y2="118" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
    </line>
    <polygon points="394,118 400,128 406,118" fill="#38bdf8"/>
  </g>

  <!-- Three columns: Vercel | Render | Supabase -->
  <!-- Vercel -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <rect x="40" y="130" width="220" height="100" rx="10" fill="#0f172a" stroke="url(#vercel)" stroke-width="2"/>
    <rect x="55" y="142" width="190" height="32" rx="6" fill="url(#vercel)" opacity="0.2"/>
    <text x="150" y="164" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">▲ Vercel</text>
    <text x="150" y="188" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">Next.js Frontend</text>
    <text x="150" y="206" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">Edge Middleware · SSR</text>
    <text x="150" y="220" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#475569">React 19 · Tailwind 4 · GSAP</text>
  </g>

  <!-- Arrow Vercel → Render -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <line x1="260" y1="155" x2="290" y2="175" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <polygon points="287,170 295,180 282,177" fill="#38bdf8"/>
    <text x="270" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#38bdf8">HTTP</text>
  </g>

  <!-- Render -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <rect x="293" y="130" width="220" height="140" rx="10" fill="#0f172a" stroke="url(#render)" stroke-width="2"/>
    <rect x="308" y="142" width="190" height="32" rx="6" fill="url(#render)" opacity="0.2"/>
    <text x="403" y="164" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#93c5fd">🐳 Render</text>
    <text x="403" y="188" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">FastAPI Backend</text>
    <text x="403" y="206" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">Docker · Uvicorn · 4 Workers</text>
    <text x="403" y="224" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Python 3.12 · Pydantic</text>

    <!-- Agent Pipeline mini-box -->
    <rect x="316" y="238" width="174" height="26" rx="4" fill="url(#pipeline)" opacity="0.15"/>
    <text x="403" y="256" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" font-weight="600" fill="#fcd34d">🤖 Agent Pipeline (5 agents)</text>
  </g>

  <!-- Arrow Render → Supabase -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <line x1="350" y1="270" x2="250" y2="350" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.3s" repeatCount="indefinite"/>
    </line>
    <polygon points="254,345 248,355 260,348" fill="#8b5cf6"/>
  </g>

  <!-- Supabase -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
    <rect x="40" y="330" width="220" height="130" rx="10" fill="#0f172a" stroke="url(#supa)" stroke-width="2"/>
    <rect x="55" y="342" width="190" height="32" rx="6" fill="url(#supa)" opacity="0.2"/>
    <text x="150" y="364" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#a78bfa">⚡ Supabase</text>
    <text x="150" y="388" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">PostgreSQL 15</text>
    <text x="150" y="406" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#64748b">7 Tables · 22 RLS Policies</text>
    <text x="150" y="424" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">Auth (JWT) · Storage</text>
    <text x="150" y="445" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#64748b">🦕 2 Edge Functions (Deno)</text>
  </g>

  <!-- Edge Function arrow to Render -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <line x1="260" y1="420" x2="293" y2="260" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <polygon points="291,265 295,255 283,261" fill="#f59e0b"/>
    <text x="255" y="345" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#f59e0b" transform="rotate(-45,255,345)">Webhook</text>
  </g>

  <!-- Right side: Edge Functions detail -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <rect x="540" y="130" width="220" height="155" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="650" y="158" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fcd34d">🦕 Edge Functions</text>
    <text x="558" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">on-profile-change</text>
    <text x="558" y="198" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Webhook on citizen_profiles</text>
    <text x="558" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Re-matches all schemes for user</text>
    <line x1="558" y1="222" x2="742" y2="222" stroke="#334155" stroke-width="1"/>
    <text x="558" y="240" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">on-scheme-change</text>
    <text x="558" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Webhook on schemes</text>
    <text x="558" y="270" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Re-matches all users for scheme</text>
  </g>

  <!-- Connection lines to right panel -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
    <line x1="513" y1="190" x2="540" y2="190" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="513" y1="230" x2="540" y2="230" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Floating particles -->
  <circle cx="100" cy="80" r="1.5" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="80" r="1" fill="#6ee7b7" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="80;68;80" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="680" cy="450" r="1.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="450;438;450" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>
