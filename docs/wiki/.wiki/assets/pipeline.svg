<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e3a5f;#0f172a" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#1e293b"><animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="420" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#38bdf8" filter="url(#glow)">
    🤖 Agent Pipeline
  </text>

  <!-- Flow: Input → 5 agents → Output -->
  <!-- Input arrow -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze"/>
    <rect x="20" y="185" width="70" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="55" y="208" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Profile</text>
  </g>

  <!-- Arrow Input → Agent 1 -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s" fill="freeze"/>
    <line x1="90" y1="203" x2="115" y2="203" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="113,197 120,203 113,209" fill="#3b82f6"/>
  </g>

  <!-- Agent 1: Intake -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="118" y="120" width="118" height="166" rx="10" fill="#0f172a" stroke="url(#g1)" stroke-width="2"/>
    <rect x="130" y="132" width="94" height="28" rx="6" fill="url(#g1)" opacity="0.2"/>
    <text x="177" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#93c5fd">📥 IntakeAgent</text>
    <text x="177" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Normalize</text>
    <text x="177" y="194" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Sanitize</text>
    <text x="177" y="210" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Validate</text>
    <text x="177" y="240" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Strips HTML</text>
    <text x="177" y="254" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Checks ranges</text>
    <text x="177" y="268" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Defaults missing</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <line x1="236" y1="203" x2="261" y2="203" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="259,197 266,203 259,209" fill="#10b981"/>
  </g>

  <!-- Agent 2: Eligibility -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <rect x="264" y="120" width="118" height="166" rx="10" fill="#0f172a" stroke="url(#g2)" stroke-width="2"/>
    <rect x="276" y="132" width="94" height="28" rx="6" fill="url(#g2)" opacity="0.2"/>
    <text x="323" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">✅ Eligibility</text>
    <text x="323" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Age · Income</text>
    <text x="323" y="194" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Occupation · Caste</text>
    <text x="323" y="210" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Disability · State</text>
    <text x="323" y="226" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Gender</text>
    <text x="323" y="254" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Geo. mean scoring</text>
    <text x="323" y="268" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Boundary penalties</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
    <line x1="382" y1="203" x2="407" y2="203" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="405,197 412,203 405,209" fill="#f59e0b"/>
  </g>

  <!-- Agent 3: Ranking -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <rect x="410" y="120" width="118" height="166" rx="10" fill="#0f172a" stroke="url(#g3)" stroke-width="2"/>
    <rect x="422" y="132" width="94" height="28" rx="6" fill="url(#g3)" opacity="0.2"/>
    <text x="469" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#fcd34d">📊 Ranking</text>
    <text x="469" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Value tier parsing</text>
    <text x="469" y="194" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Combined scoring</text>
    <text x="469" y="210" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Tie-breaking</text>
    <text x="469" y="240" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Tier × weight</text>
    <text x="469" y="254" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">+ match × weight</text>
    <text x="469" y="268" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Category priority</text>
  </g>

  <!-- Arrow 3 → 4 -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
    <line x1="528" y1="203" x2="553" y2="203" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="551,197 558,203 551,209" fill="#ec4899"/>
  </g>

  <!-- Agent 4: DocGap -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <rect x="556" y="120" width="118" height="166" rx="10" fill="#0f172a" stroke="url(#g4)" stroke-width="2"/>
    <rect x="568" y="132" width="94" height="28" rx="6" fill="url(#g4)" opacity="0.2"/>
    <text x="615" y="150" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#f9a8d4">📋 DocGap</text>
    <text x="615" y="178" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Query documents</text>
    <text x="615" y="194" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Compare vs required</text>
    <text x="615" y="210" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Return missing</text>
    <text x="615" y="240" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Only verified docs</text>
    <text x="615" y="254" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#475569">Fallback to profile</text>
  </g>

  <!-- Output -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <line x1="674" y1="203" x2="704" y2="203" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <polygon points="702,197 709,203 702,209" fill="#8b5cf6"/>
    <rect x="712" y="185" width="70" height="36" rx="18" fill="url(#g5)"/>
    <text x="747" y="208" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">Matches</text>
  </g>

  <!-- Bottom: DrafterAgent separate flow -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    <rect x="264" y="310" width="272" height="50" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="400" y="332" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#a78bfa">📝 DrafterAgent <tspan fill="#64748b" font-weight="400" font-size="10">(separate flow)</tspan></text>
    <text x="400" y="350" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#64748b">Template-based → Optional Groq polish → Draft letter</text>
  </g>

  <!-- Dotted line from pipeline to drafter -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2s" fill="freeze"/>
    <line x1="469" y1="286" x2="469" y2="310" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="1s" repeatCount="indefinite"/>
    </line>
    <polygon points="465,308 469,315 473,308" fill="#8b5cf6"/>
  </g>

  <!-- Particles -->
  <circle cx="50" cy="60" r="1.5" fill="#3b82f6" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="70" r="1" fill="#8b5cf6" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="70;58;70" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>
