<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e3a5f;#0f172a" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#1e293b"><animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="120" rx="10" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Decorative left bar -->
  <rect x="0" y="0" width="5" height="120" fill="#38bdf8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- योजना साथी (Devanagari) -->
  <text x="400" y="36" text-anchor="middle" font-family="'Nirmala UI','Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#e2e8f0" filter="url(#glow)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
    🙏 योजना साथी
  </text>

  <!-- DocLens (Latin) -->
  <text x="400" y="58" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="url(#accent)">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
    DocLens
  </text>

  <!-- Tagline -->
  <text x="400" y="82" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#94a3b8">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
    Government Welfare Scheme Eligibility Engine
  </text>

  <!-- Tech badges -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    <rect x="245" y="90" width="58" height="18" rx="9" fill="#1e293b" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="274" y="103" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#60a5fa">FastAPI</text>
    <rect x="310" y="90" width="58" height="18" rx="9" fill="#1e293b" stroke="#10b981" stroke-width="0.8"/>
    <text x="339" y="103" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#34d399">Next.js</text>
    <rect x="375" y="90" width="58" height="18" rx="9" fill="#1e293b" stroke="#8b5cf6" stroke-width="0.8"/>
    <text x="404" y="103" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#a78bfa">Supabase</text>
    <rect x="440" y="90" width="58" height="18" rx="9" fill="#1e293b" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="469" y="103" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#fbbf24">PostgreSQL</text>
    <rect x="505" y="90" width="58" height="18" rx="9" fill="#1e293b" stroke="#ec4899" stroke-width="0.8"/>
    <text x="534" y="103" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="8" fill="#f472b6">Python</text>
  </g>

  <!-- Particles -->
  <circle cx="60" cy="40" r="1.5" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="45" r="1" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="45;33;45" dur="3.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="700" cy="100" r="1.3" fill="#fbbf24" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="100;90;100" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
