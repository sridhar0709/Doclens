<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"><animate attributeName="stop-color" values="#0f172a;#1e3a5f;#0f172a" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#1e293b"><animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="frontend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="supabase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="docs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" rx="12" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" font-weight="bold" fill="#38bdf8" filter="url(#glow)">
    📂 Project Structure
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Root node -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
    <rect x="30" y="52" width="740" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="48" y="76" font-family="'Courier New',monospace" font-size="16" font-weight="bold" fill="#e2e8f0">DocLens/</text>
  </g>

  <!-- Backend -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    <rect x="50" y="98" width="720" height="28" rx="4" fill="url(#backend)" opacity="0.15"/>
    <rect x="50" y="100" width="4" height="24" rx="2" fill="#3b82f6"/>
    <text x="62" y="118" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#93c5fd">├── Backend/</text>
    <text x="400" y="118" font-family="'Courier New',monospace" font-size="11" fill="#64748b"># FastAPI application</text>
  </g>

  <!-- Backend children -->
  <g font-family="'Courier New',monospace" font-size="12" fill="#94a3b8">
    <text x="82" y="146" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>│   ├── main.py <tspan fill="#64748b"># 18 API endpoints</tspan></text>
    <text x="82" y="166" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>│   ├── agents/ <tspan fill="#64748b"># Pipeline agents (7)</tspan></text>
    <text x="82" y="186" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>│   ├── core/ <tspan fill="#64748b"># Auth, guardrails, config</tspan></text>
    <text x="82" y="206" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>│   ├── llm/ <tspan fill="#64748b"># Groq client</tspan></text>
    <text x="82" y="226" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>│   ├── models/ <tspan fill="#64748b"># Pydantic models</tspan></text>
    <text x="82" y="246" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>│   └── data/ <tspan fill="#64748b"># Scheme definitions</tspan></text>
  </g>

  <!-- Frontend -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
    <rect x="50" y="264" width="720" height="28" rx="4" fill="url(#frontend)" opacity="0.15"/>
    <rect x="50" y="266" width="4" height="24" rx="2" fill="#10b981"/>
    <text x="62" y="284" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#6ee7b7">├── frontend/</text>
    <text x="400" y="284" font-family="'Courier New',monospace" font-size="11" fill="#64748b"># Next.js application</text>
  </g>

  <!-- Frontend children -->
  <g font-family="'Courier New',monospace" font-size="12" fill="#94a3b8">
    <text x="82" y="312" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>│   ├── app/ <tspan fill="#64748b"># App Router (4 route groups)</tspan></text>
    <text x="82" y="332" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>│   ├── components/ <tspan fill="#64748b"># React components (20+)</tspan></text>
    <text x="82" y="352" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.9s" fill="freeze"/>│   ├── contexts/ <tspan fill="#64748b"># Auth context</tspan></text>
    <text x="82" y="372" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.0s" fill="freeze"/>│   ├── hooks/ <tspan fill="#64748b"># useAuth</tspan></text>
    <text x="82" y="392" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>│   └── lib/ <tspan fill="#64748b"># API client, Supabase, utils</tspan></text>
  </g>

  <!-- Supabase -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/>
    <rect x="50" y="410" width="720" height="28" rx="4" fill="url(#supabase)" opacity="0.15"/>
    <rect x="50" y="412" width="4" height="24" rx="2" fill="#8b5cf6"/>
    <text x="62" y="430" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#a78bfa">├── supabase/</text>
  </g>

  <!-- Supabase children -->
  <g font-family="'Courier New',monospace" font-size="12" fill="#94a3b8">
    <text x="82" y="458" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>│   ├── migrations/ <tspan fill="#64748b"># 4 consolidated SQL migrations</tspan></text>
    <text x="82" y="478" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>│   └── functions/ <tspan fill="#64748b"># 2 Deno edge functions</tspan></text>
  </g>

  <!-- Docs -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.8s" fill="freeze"/>
    <rect x="50" y="496" width="720" height="28" rx="4" fill="url(#docs)" opacity="0.15"/>
    <rect x="50" y="498" width="4" height="24" rx="2" fill="#f59e0b"/>
    <text x="62" y="516" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#fcd34d">└── docs/wiki/ <tspan fill="#64748b" font-weight="normal"># Wiki source</tspan></text>
  </g>

  <!-- Decorative particles -->
  <circle cx="120" cy="60" r="1.5" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="680" cy="140" r="1" fill="#10b981" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cy" values="140;128;140" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="720" cy="420" r="1.5" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="420;408;420" dur="3.5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="100" cy="490" r="1" fill="#fcd34d" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="2.8s" repeatCount="indefinite" begin="2.5s"/>
    <animate attributeName="cy" values="490;480;490" dur="2.8s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
</svg>
